name: CI

on:
  push:
    branches:
      - main
      - master
    tags: '*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sisap26/julia-baseline .

      - name: Run search (all tasks)
        run: |
          mkdir -p results/task-1-spot-check results/task-2-spot-check results/task-3-spot-check
          for task in 1 2 3; do
            echo "=== Task $task ==="
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --volume $(pwd)/search.jl:/app/search.jl:ro \
              --volume $(pwd)/data:/app/data:ro \
              --volume $(pwd)/results:/app/results:rw \
              sisap26/julia-baseline \
              --input data/task-$task-spot-check/*.h5 \
              --task-description data/task-$task-spot-check/config.json \
              --output results/task-$task-spot-check/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Results
          path: results/
